<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Admin — Menu Management</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #FFF; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #1E1E1E; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { color: #D4AF37; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #AAA; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; background: #2A2A2A; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
    .btn { background: #D4AF37; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #c29f2e; }
    .menu-list { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
    .menu-item-row { display: flex; justify-content: space-between; align-items: center; background: #2A2A2A; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; }
    .btn-delete { background: #D32F2F; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .login-box { display: flex; gap: 10px; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🍽️ Restaurant Admin Dashboard</h2>

  <!-- Login / Select Company Slug -->
  <div class="login-box">
    <input type="text" id="companySlugInput" placeholder="Enter Company Slug (e.g. lechic)" value="lechic">
    <button class="btn" style="width: 140px; margin-top: 0;" onclick="loadAdminMenu()">Load Menu</button>
  </div>

  <div id="adminContent" style="display: none;">
    <h3 id="adminTitle" style="color: #00E676; margin-bottom: 15px;"></h3>

    <!-- Add Item Form -->
    <div style="background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
      <h4>Add New Menu Item</h4>
      <div class="form-group" style="margin-top: 10px;">
        <label>Category Name</label>
        <input type="text" id="itemCategory" placeholder="e.g. Hot Drinks, Lunch Entrees">
      </div>
      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Espresso, Beef Burger">
      </div>
      <div class="form-group">
        <label>Price (RWF)</label>
        <input type="number" id="itemPrice" placeholder="e.g. 4000">
      </div>
      <button class="btn" onclick="addNewItem()">+ Save Item to Live Menu</button>
    </div>

    <!-- Existing Menu Items List -->
    <div class="menu-list">
      <h4>Current Active Menu Items</h4>
      <div id="currentMenuItems" style="margin-top: 10px;">
        <p style="color: #777;">Loading items...</p>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://greatservice.page.gd/API";

  function loadAdminMenu() {
    const slug = document.getElementById('companySlugInput').value.trim();
    if (!slug) {
      alert("Please enter a company slug.");
      return;
    }

    fetch(`${API_BASE}/get_menu.php?company=${slug}`)
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById('adminContent').style.display = 'block';
          document.getElementById('adminTitle').textContent = `Managing: ${data.company_name}`;
          renderAdminItems(data.menu_items);
        } else {
          alert("Company slug not found in database.");
        }
      })
      .catch(err => alert("Error connecting to server."));
  }

  function renderAdminItems(items) {
    const container = document.getElementById('currentMenuItems');
    if (items.length === 0) {
      container.innerHTML = `<p style="color: #777;">No menu items found. Add your first item above!</p>`;
      return;
    }

    let html = "";
    items.forEach(item => {
      html += `
        <div class="menu-item-row">
          <div>
            <strong>${item.item_name}</strong> <span style="color:#aaa; font-size:12px;">(${item.category})</span>
            <div style="color: #D4AF37; font-size: 14px;">${Number(item.price).toLocaleString()} RWF</div>
          </div>
          <button class="btn-delete" onclick="deleteItem(${item.id})">Delete</button>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function addNewItem() {
    const slug = document.getElementById('companySlugInput').value.trim();
    const category = document.getElementById('itemCategory').value.trim();
    const item_name = document.getElementById('itemName').value.trim();
    const price = document.getElementById('itemPrice').value.trim();

    if (!category || !item_name || !price) {
      alert("Please fill in all fields.");
      return;
    }

    fetch(`${API_BASE}/add_menu_item.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_slug: slug, category, item_name, price })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        alert("Item added successfully!");
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        loadAdminMenu(); // Refresh list
      } else {
        alert(data.message);
      }
    });
  }

  function deleteItem(itemId) {
    if (!confirm("Are you sure you want to delete this menu item?")) return;

    fetch(`${API_BASE}/delete_menu_item.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: itemId })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        loadAdminMenu(); // Refresh list
      } else {
        alert(data.message);
      }
    });
  }

  // Auto-load on page load if slug is present
  window.onload = () => {
    loadAdminMenu();
  };

  // Add a timeout signal to prevent infinite hanging
const controller = new AbortController();
const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout

fetch(`https://greatservice.page.gd/API/get_menu.php?company=${companySlug}`, { signal: controller.signal })
  .then(res => res.json())
  .then(data => {
    clearTimeout(timeoutId);
    // process data...
  })
  .catch(err => {
    console.warn("Backend slow or offline, showing fallback.");
  });
</script>
</body>
</html>
