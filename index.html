<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Chic Café QR Menu</title>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<!-- PDF.js SDK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>☕ Le Chic Café</h1>
    <p id="status">Checking table and generating menu...</p>

    <div class="spinner"></div>
    <div id="menu"></div>

    <button id="openPdf">📖 View Full Menu</button>

    <div id="pdfContainer">
      <div id="pdfViewer"></div>
      <div class="navButtons">
        <button id="prevPage">⬅ Prev</button>
        <span id="pageInfo"></span>
        <button id="nextPage">Next ➡</button>
      </div>
    </div>
  </div>
</div>

<!-- Floating Chat Toggle Button -->
<div id="chat-toggle">💬</div>

<!-- Chatbox Container -->
<div id="chat-box">
  <div id="chat-header">
    <span>Chat with us</span>
    <button id="chat-close">✖</button>
  </div>
  <iframe src="https://www.chatbase.co/chatbot-iframe/dbdzO-xP2dOJor0WlXtju" frameborder="0"></iframe>
</div>

<!-- Notification Sound -->
<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">
</audio>

<!-- Main Logic Script -->
<script src="script.js"></script>
</body>
</html>
