<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiter Live Alert Terminal</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #111; color: #FFF; margin: 0; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .alert-card { background: #222; border-left: 5px solid #D4AF37; padding: 15px; border-radius: 8px; margin-top: 12px; }
    .alert-card.scan { border-left-color: #00E676; }
    .btn-ack { background: #00E676; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-confirm { background: #29B6F6; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="header">
  <h2>🔔 Staff Live Alerts</h2>
  <button onclick="enableAudio()" style="background:#444; color:#FFF; border:none; padding:6px 12px; border-radius:6px;">🔊 Enable Audio</button>
</div>

<div id="alertsContainer">
  <p style="color:#888;">Listening for QR table scans and orders...</p>
</div>

<!-- Audio notification sound -->
<audio id="alertSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"></audio>

<script>
  const API_BASE = "https://your-domain.infinityfreeapp.com/api";
  const companyId = 1; // Multi-tenant company ID
  let audioEnabled = false;
  let knownScans = new Set();
  let knownOrders = new Set();

  function enableAudio() {
    audioEnabled = true;
    document.getElementById('alertSound').play().catch(()=>{});
    alert("Audio notifications enabled!");
  }

  function pollFeed() {
    fetch(`${API_BASE}/waiter_feed.php?company_id=${companyId}`)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('alertsContainer');
        let html = "";
        let hasNewAlert = false;

        // Process Table Scans
        data.scans.forEach(scan => {
          if (!knownScans.has(scan.id)) {
            knownScans.add(scan.id);
            hasNewAlert = true;
          }
          html += `
            <div class="alert-card scan">
              <strong style="color:#00E676; font-size:18px;">📍 TABLE ${scan.table_number} SCANNED QR!</strong>
              <div>Client waiting for service (${new Date(scan.scanned_at).toLocaleTimeString()})</div>
              <button class="btn-ack" onclick="ackScan(${scan.id})">✅ Acknowledge & Attend</button>
            </div>
          `;
        });

        // Process Orders
        data.orders.forEach(order => {
          if (!knownOrders.has(order.id)) {
            knownOrders.add(order.id);
            hasNewAlert = true;
          }
          const items = JSON.parse(order.items_json);
          const itemNames = items.map(i => i.name).join(", ");

          html += `
            <div class="alert-card">
              <strong style="color:#29B6F6; font-size:18px;">🛒 TABLE ${order.table_number} ORDERED</strong>
              <div>Items: <strong>${itemNames}</strong></div>
              <div>Total: ${Number(order.total_amount).toLocaleString()} RWF</div>
              <div>Status: <em>${order.status}</em></div>
              <button class="btn-confirm" onclick="confirmOrder(${order.id}, 'confirmed')">👍 Confirm Order with Customer</button>
            </div>
          `;
        });

        if(html !== "") {
          container.innerHTML = html;
        } else {
          container.innerHTML = `<p style="color:#888;">No pending calls or orders right now.</p>`;
        }

        if (hasNewAlert && audioEnabled) {
          document.getElementById('alertSound').play().catch(()=>{});
        }
      });
  }

  function ackScan(scanId) {
    fetch(`${API_BASE}/update_order.php`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ scan_id: scanId, scan_status: 'completed' })
    }).then(() => pollFeed());
  }

  function confirmOrder(orderId, status) {
    fetch(`${API_BASE}/update_order.php`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ order_id: orderId, status: status })
    }).then(() => pollFeed());
  }

  // Poll server every 3 seconds for instant updates
  setInterval(pollFeed, 3000);
  pollFeed();
</script>
</body>
</html>
